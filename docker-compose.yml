x-app: &app
  build: ./backend
  restart: unless-stopped
  environment: &env
    DATABASE_URL: postgresql+asyncpg://tasks:tasks@postgres:5432/tasks
    BROKER: ${BROKER:-redis}            # redis | rabbitmq
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    # HTTP tasks may not call private/internal addresses (SSRF protection), except these hosts.
    # Demo default lets webhook tasks call this system's own API; set to "" in production.
    HTTP_ALLOWED_HOSTS: ${HTTP_ALLOWED_HOSTS-api}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    volumes: [pg-data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # AOF persistence so queued ids survive restarts
    volumes: [redis-data:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]                # management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  api:
    <<: *app
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *env
      RUNNER_URL: http://runner:9000
      RUNNER_TOKEN: ${RUNNER_TOKEN:-change-me-runner-token}
    networks: [default, sandbox]                       # the only service that can reach the runner
    stop_grace_period: 40s                             # graceful shutdown lets running jobs finish
    deploy:
      replicas: ${WORKERS:-2}

  scheduler:
    <<: *app
    command: ["python", "-m", "app.scheduler"]

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

  # Executes user Python/shell code. Deliberately isolated:
  #  - only on the internal "sandbox" network: cannot reach Postgres, Redis, RabbitMQ or the internet
  #  - no database/broker credentials in its environment
  #  - read-only filesystem (scratch space is a small tmpfs), non-root, no capabilities
  #  - pids/memory/cpu caps on top of per-script rlimits (see app/sandbox.py)
  runner:
    build: ./backend
    command: ["uvicorn", "app.runner:app", "--host", "0.0.0.0", "--port", "9000"]
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-change-me-runner-token}
      RUNNER_MAX_CONCURRENCY: 4
      RUNNER_MEMORY_MB: 256
    networks: [sandbox]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    # Set RUNNER_NO_NEW_PRIVILEGES=false only where Docker can't support it (e.g. snap-installed Docker's
    # AppArmor profile blocks exec with it). cap_drop: ALL still prevents gaining privileges.
    security_opt: ["no-new-privileges:${RUNNER_NO_NEW_PRIVILEGES:-true}"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      retries: 10

networks:
  default:
  sandbox:
    internal: true    # no route to the outside world

volumes:
  pg-data:
  redis-data:
