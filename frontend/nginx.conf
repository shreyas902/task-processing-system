server {
    listen 80;
    # Docker's embedded DNS; re-resolve so a recreated container (new IP) doesn't cause 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://api:8000;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass $upstream;
    }

    location / {
        try_files $uri /index.html;
    }
}
